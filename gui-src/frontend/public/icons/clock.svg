<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Alarm bells -->
  <circle cx="16" cy="14" r="8" fill="white" opacity="0.9"/>
  <circle cx="48" cy="14" r="8" fill="white" opacity="0.9"/>
  <!-- Clock body -->
  <circle cx="32" cy="36" r="24" fill="white"/>
  <circle cx="32" cy="36" r="20" fill="#1a1a2e"/>
  <!-- Clock face -->
  <circle cx="32" cy="36" r="18" fill="white"/>
  <!-- Hour markers -->
  <circle cx="32" cy="20" r="2" fill="#1a1a2e"/>
  <circle cx="32" cy="52" r="2" fill="#1a1a2e"/>
  <circle cx="16" cy="36" r="2" fill="#1a1a2e"/>
  <circle cx="48" cy="36" r="2" fill="#1a1a2e"/>
  <!-- Clock hands -->
  <line x1="32" y1="36" x2="32" y2="24" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="42" y2="36" stroke="#E01E5A" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="36" r="3" fill="#1a1a2e"/>
  <!-- Legs -->
  <rect x="20" y="56" width="4" height="6" rx="2" fill="white" opacity="0.9"/>
  <rect x="40" y="56" width="4" height="6" rx="2" fill="white" opacity="0.9"/>
</svg>