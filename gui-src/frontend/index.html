<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <title>MultiVerse Desktop · Task snapshots</title>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state — shown until React mounts (covers the
           initTimeOverride fetch + JS bundle load). Automatically replaced
           by ReactDOM.createRoot().render(). -->
      <style>
        #initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          gap: 1rem;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        #initial-loader .spinner {
          width: 2.5rem;
          height: 2.5rem;
          border: 4px solid rgba(255, 255, 255, 0.25);
          border-top-color: #fff;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div id="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
