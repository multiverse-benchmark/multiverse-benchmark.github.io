name: Deploy to GitHub Pages
# Started by hand for changes of the site. A change of the leaderboard's
# submissions on main (a merged submission pull request) starts it by itself,
# so that the board on the site always equals the committed submissions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'submissions/v*/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm --prefix gui-src ci
      # The unit tests of the leaderboard's confidence intervals need NumPy, and so does the build
      # once the leaderboard has submitted entries (scripts/build_board.py).
      - run: python3 -m pip install numpy
      - run: PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests
      - run: npm run validate:data
      # The submitted entries of the leaderboard; their confidence intervals need NumPy too.
      - run: npm run validate:submissions
      - run: npm run validate:tools
      - run: npm run validate:showcase
      - run: npm run test:calendar
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://multiverse-benchmark.com/' }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
